      b2b_import_operations_platform:
        title: "Plataforma B2B de Importação e Operações"
        subtitle: "Ruby on Rails · PostgreSQL · Monday.com · GraphQL · Sidekiq · Redis"
        short_description: "Trabalho profissional de engenharia em um sistema voltado ao cliente que transforma fluxos de importação, embarque, finanças e negociações em software Rails dedicado."
        description: |
          Problema
          As informações operacionais estavam distribuídas em vários quadros do Monday.com e domínios de negócio. Os clientes precisavam de uma experiência coesa para importações, embarques, negociações, créditos, multas, descontos, indicadores financeiros e cálculos de valores finais.

          No que trabalhei
          Integrei Rails com a API GraphQL do Monday.com, normalizei registros de quadros financeiros, embarques, negociações e clientes — incluindo subitens — e os mapeei para conceitos da aplicação. Traduzi regras específicas de clientes e estados operacionais em comportamentos Rails e customizei a autenticação Devise em torno de CNPJ brasileiro normalizado e dados do cliente.

          Destaques de engenharia
          • Construí consultas GraphQL e mapeamentos específicos por quadro sem expor identificadores privados.
          • Usei Sidekiq e Redis para processamento assíncrono confiável.
          • Modelei dados relacionais de negócio com PostgreSQL, Active Record e lógica de serviço focada.
          • Implementei limitação de requisições com Rack::Attack para login e tráfego geral, além de controles CSP.
          • Tratei propriedade de recursos, riscos de acesso do tipo IDOR e autorização de clientes.
          • Adicionei auditoria estruturada de requisições e rastreabilidade das ações dos usuários.
      stagilux:
        short_description: "SaaS Multi-tenant para Gestão de Fornecedores e Documentos"
        description: |
          Problema
          A qualificação de fornecedores depende do contexto da empresa, acesso por função, validade de documentos e análise manual. O projeto explora como um SaaS B2B pode tornar esse fluxo explícito e automatizável.

          No que trabalhei
          Modelei empresas, vínculos e recursos por empresa com acts_as_tenant. Os papéis incluem administrador da empresa, funcionário, fornecedor, gestor de homologação e visualizador, com estados ativo, suspenso, inativo e bloqueado. Policies e scopes do Pundit mantêm o acesso consciente do tenant e da função.

          Destaques de engenharia
          • Ciclo do fornecedor desde rascunho até análise e aprovação.
          • Estados de documentos pendentes e expirados, com atualização agendada de validade e notificações.
          • Ciclo independente de verificação: aguardando, limpo, infectado ou falhou.
          • Verificação assíncrona com ClamAV antes de o documento prosseguir.
          • Extração de texto por OCR seguida de validações por palavras-chave e regex para automatizar parte da conferência documental.
      checkoutpay:
        short_description: "Arquitetura de Processamento de Pagamentos"
        description: |
          Projeto de engenharia focado em conceitos de processamento confiável de transações, sem se apresentar como um provedor de pagamentos em produção.

          Modela o ciclo do pagamento de pendente para processando e, então, concluído ou falhou. Uma chave de idempotência evita cobranças duplicadas acidentais, enquanto um serviço focado na criação da cobrança e um processador assíncrono separam a requisição do processamento externo.
      opsflow:
        short_description: "Experimento de Microsserviços Rails e Orquestração de Fluxos"
        description: |
          Projeto de arquitetura e aprendizado que explora a comunicação entre serviços de autenticação, intenção, planejamento, processo e tarefas.

          O fluxo conceitual conduz o usuário da autenticação por token à captura da intenção, planejamento do fluxo, criação do processo e orquestração de tarefas. JWT/HS256 protege os pontos de entrada, enquanto Sidekiq e Redis sustentam filas assíncronas críticas, padrão e de baixa prioridade.
      estoquei:
        short_description: "Aplicação de Comércio e Estoque"
        description: |
          Aplicação Rails que modela três atores de negócio: clientes consultam produtos, gerenciam o carrinho e finalizam a compra; lojistas administram produtos e pedidos; fornecedores utilizam seu próprio painel e fluxos.

          O projeto demonstra associações Active Record, modelagem relacional e fluxos orientados por papéis em um domínio prático de comércio.
