# fly.toml app configuration file generated for portfolio-ktt on 2026-09-01T17:49:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'portfolio-ktt'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  RAILS_LOG_LEVEL = 'info'
  SEED_ON_BOOT = 'true'

[[mounts]]
  source = 'portfolio_data'
  destination = '/rails/storage'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/up'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
